[package]
name = "orbment-importer"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
orbment-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml_edit.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
windows = { workspace = true, features = ["Win32_Globalization"] }
chrono = { version = "0.4", features = ["clock"] }
csv = "1"
tempfile = "3"
same-file = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
